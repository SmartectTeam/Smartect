<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/base}">
<head>
    <meta charset="UTF-8">
    <title>Event Log</title>
    <link rel="stylesheet" th:href="@{/css/eventboard.css}">
</head>

<div layout:fragment="content">

    <div class="eventboard-container">

        <!-- 헤더 -->
        <header class="eventboard-header">
            <h1>EVENT LOG</h1>
            <span class="sub-text">객체 감지 기록 및 위험 이벤트 이력 조회</span>
        </header>

        <div class="eventboard-main">

            <!-- LEFT -->
            <div class="event-list">
                <h2>이벤트 목록</h2>

                <div class="filter-row">
                    <input id="searchBox" type="text" placeholder="검색 (카메라 / 위치 / 유형)">
                    <button class="primary-btn" onclick="loadEvents()">검색</button>
                </div>

                <!-- 유형 -->
                <div class="filter-group">
                    <span class="filter-label">이벤트 유형</span>
                    <div class="chip-group" data-filter="type">
                        <button class="chip-btn active" data-value="ALL">ALL</button>
                        <button class="chip-btn" data-value="FIRE">FIRE</button>
                        <button class="chip-btn" data-value="ACCESS">ACCESS</button>
                        <button class="chip-btn" data-value="SUSPICIOUS">SUSPICIOUS</button>
                    </div>
                </div>

                <!-- 기간 -->
                <div class="filter-group">
                    <span class="filter-label">기간</span>
                    <div class="chip-group" data-filter="period">
                        <button class="chip-btn active" data-value="ALL">전체</button>
                        <button class="chip-btn" data-value="TODAY">오늘</button>
                        <button class="chip-btn" data-value="WEEK">1주</button>
                        <button class="chip-btn" data-value="MONTH">1개월</button>
                    </div>
                </div>

                <!-- 확인 상태 -->
                <div class="filter-group">
                    <span class="filter-label">확인 상태</span>
                    <div class="chip-group" data-filter="checked">
                        <button class="chip-btn active" data-value="ALL">ALL</button>
                        <button class="chip-btn" data-value="UNCHECKED">미확인</button>
                        <button class="chip-btn" data-value="CHECKED">확인</button>
                    </div>
                </div>

                <ul id="eventList"></ul>
            </div>

            <!-- RIGHT -->
            <div class="event-detail">
                <h2>이벤트 상세</h2>
                <div id="detailBox" class="detail-box">
                    <p>이벤트를 선택하세요</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        const events = [
            {id:1, cam:"CAM-01", location:"전시장 A", type:"FIRE", createdAt:"2025-01-15T10:32", memo:"연기 감지", checkedAt:null},
            {id:2, cam:"CAM-02", location:"출입구", type:"ACCESS", createdAt:"2025-01-15T09:58", memo:"출입 제한 구역 침입", checkedAt:"2025-01-15T10:05"},
            {id:3, cam:"CAM-03", location:"복도", type:"SUSPICIOUS", createdAt:"2025-01-14T18:21", memo:"의심 행동 감지", checkedAt:null}
        ];
        <!-- 로그 목록 선택 상태 초기화 -->
        let selectedEventId = null;
        let filters = { type:'ALL', period:'ALL', checked:'ALL' };

        document.querySelectorAll('.chip-group').forEach(group => {
            group.addEventListener('click', e => {
                if (!e.target.classList.contains('chip-btn')) return;

                const filterType = group.dataset.filter;
                const value = e.target.dataset.value;

                group.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                filters[filterType] = value;
                loadEvents();
            });
        });

        function loadEvents() {
            const list = document.getElementById("eventList");
            const keyword = document.getElementById("searchBox").value.toLowerCase();
            list.innerHTML = "";

            const now = new Date();

            const filtered = events.filter(e => {
                const matchType = filters.type === 'ALL' || e.type === filters.type;
                const matchChecked =
                    filters.checked === 'ALL' ||
                    (filters.checked === 'CHECKED' && e.checkedAt) ||
                    (filters.checked === 'UNCHECKED' && !e.checkedAt);

                let matchPeriod = true;
                if (filters.period !== 'ALL') {
                    const diff = (now - new Date(e.createdAt)) / 86400000;
                    if (filters.period === 'TODAY') matchPeriod = diff < 1;
                    if (filters.period === 'WEEK') matchPeriod = diff < 7;
                    if (filters.period === 'MONTH') matchPeriod = diff < 30;
                }

                const matchKeyword =
                    e.cam.toLowerCase().includes(keyword) ||
                    e.location.toLowerCase().includes(keyword) ||
                    e.type.toLowerCase().includes(keyword);

                return matchType && matchChecked && matchPeriod && matchKeyword;
            });

            if (!filtered.length) {
                list.innerHTML = "<li class='empty'>이벤트가 없습니다.</li>";
                return;
            }

                    filtered.forEach(e => {
            const li = document.createElement("li");

            li.classList.add(e.checkedAt ? 'checked' : 'unchecked');
            if (e.type === 'FIRE') li.classList.add('fire');
            if (e.id === selectedEventId) li.classList.add('selected');

            li.onclick = () => {
                selectedEventId = e.id;
                showDetail(e);
                loadEvents(); // 선택 표시 갱신
            };

            li.innerHTML = `
                <strong>${e.cam}</strong>
                <div>${e.location}</div>
                <div class="event-type">${e.type}</div>
                <div class="event-time">${e.createdAt.replace('T',' ')}</div>
            `;
            list.appendChild(li);
        });


        }
        <!-- 확인 처리 함수 -->
        function markChecked(id) {
            const target = events.find(e => e.id === id);
            if (!target) return;

            target.checkedAt = new Date().toISOString();

            showDetail(target);
            loadEvents();
        }

        function showDetail(e) {
            const checked = e.checkedAt ? '확인됨' : '미확인';

            document.getElementById("detailBox").innerHTML = `
                <h3>${e.type}</h3>
                <p><strong>카메라:</strong> ${e.cam}</p>
                <p><strong>위치:</strong> ${e.location}</p>
                <p><strong>발생 시각:</strong> ${e.createdAt.replace('T',' ')}</p>
                <p><strong>설명:</strong> ${e.memo}</p>
                <p><strong>상태:</strong> ${checked}</p>

                ${!e.checkedAt ? `
                <button class="primary-btn" onclick="markChecked(${e.id})">
                    ✔ 확인 처리
                </button>
                ` : ''}
            `;
        }


        window.onload = loadEvents;
    </script>

</div>
</html>
