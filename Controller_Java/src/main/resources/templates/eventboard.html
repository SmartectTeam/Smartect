<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/base}">
<head>
    <meta charset="UTF-8">
    <title>Event Log</title>
    <link rel="stylesheet" th:href="@{/css/eventboard.css}">
</head>

<div layout:fragment="content">

    <div class="eventboard-container">

        <!-- 헤더 -->
        <header class="eventboard-header">
            <h1>EVENT LOG</h1>
            <span class="sub-text">객체 감지 기록 및 위험 이벤트 이력 조회</span>
        </header>

        <div class="eventboard-main">

            <!-- LEFT -->
            <div class="event-list">
                <h2>이벤트 목록</h2>

                <div class="filter-row">
                    <input id="searchBox" type="text" placeholder="검색 (카메라 / 위치 / 유형)">
                    <button class="primary-btn" onclick="renderEvents()">검색</button>
                </div>

                <!-- 필터 -->
                <div class="filter-group">
                    <span class="filter-label">이벤트 유형</span>
                    <div class="chip-group" data-filter="type">
                        <button class="chip-btn active" data-value="ALL">ALL</button>
                        <button class="chip-btn" data-value="FIRE">FIRE</button>
                        <button class="chip-btn" data-value="ACCESS">ACCESS</button>
                        <button class="chip-btn" data-value="SUSPICIOUS">SUSPICIOUS</button>
                    </div>
                </div>

                <div class="filter-group">
                    <span class="filter-label">기간</span>
                    <div class="chip-group" data-filter="period">
                        <button class="chip-btn active" data-value="ALL">ALL</button>
                        <button class="chip-btn" data-value="TODAY">오늘</button>
                        <button class="chip-btn" data-value="WEEK">일주일</button>
                        <button class="chip-btn" data-value="MONTH">한달</button>
                    </div>
                </div>

                <div class="filter-group">
                    <span class="filter-label">확인 상태</span>
                    <div class="chip-group" data-filter="checked">
                        <button class="chip-btn active" data-value="ALL">ALL</button>
                        <button class="chip-btn" data-value="UNCHECKED">UNCHECK</button>
                        <button class="chip-btn" data-value="CHECKED">CHECKED</button>
                    </div>
                </div>

                <ul id="eventList"></ul>
            </div>

            <!-- RIGHT -->
            <div class="event-detail">
                <h2>이벤트 상세</h2>
                <div id="detailBox" class="detail-box">
                    <p>이벤트를 선택하세요</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        let events = [];
        let selectedEventId = null;
        let filters = { type:'ALL', period:'ALL', checked:'ALL' };

        /* ================= 필터 ================= */
        document.querySelectorAll('.chip-group').forEach(group => {
            group.addEventListener('click', e => {
                if (!e.target.classList.contains('chip-btn')) return;

                group.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                filters[group.dataset.filter] = e.target.dataset.value;
                renderEvents();
            });
        });

        /* ================= 데이터 로딩 ================= */
        function loadEvents(){
            fetch("/api/events")
                .then(res => res.json())
                .then(data =>{
                    events = data.map(e => ({
                        id: e.eventNo,
                        cam: e.camDTO.name,
                        location: e.camDTO.location,
                        type: e.eventType,
                        memo: e.memo,
                        createdAt: e.createdAt,
                        checkedAt: e.checkedAt
                    }));
                    renderEvents();
                })
                .catch(err => console.error("로그 목록 로딩 실패", err));
        }

        /* ================= 상대시간 ================= */
        function relativeTime(dateStr){
            const diff = (new Date() - new Date(dateStr)) / 1000;
            if (diff < 60) return "방금 전";
            if (diff < 3600) return Math.floor(diff/60) + "분 전";
            if (diff < 86400) return Math.floor(diff/3600) + "시간 전";
            return Math.floor(diff/86400) + "일 전";
        }

        /* ================= 목록 ================= */
        function renderEvents() {
            const list = document.getElementById("eventList");
            const keyword = document.getElementById("searchBox").value.toLowerCase();
            list.innerHTML = "";

            const now = new Date();

            const filtered = events.filter(e => {
                const matchType = filters.type === 'ALL' || e.type === filters.type;
                const matchChecked =
                    filters.checked === 'ALL' ||
                    (filters.checked === 'CHECKED' && e.checkedAt) ||
                    (filters.checked === 'UNCHECKED' && !e.checkedAt);

                let matchPeriod = true;
                if (filters.period !== 'ALL') {
                    const diff = (now - new Date(e.createdAt)) / 86400000;
                    if (filters.period === 'TODAY') matchPeriod = diff < 1;
                    if (filters.period === 'WEEK') matchPeriod = diff < 7;
                    if (filters.period === 'MONTH') matchPeriod = diff < 30;
                }

                const matchKeyword =
                    e.cam.toLowerCase().includes(keyword) ||
                    e.location.toLowerCase().includes(keyword) ||
                    e.type.toLowerCase().includes(keyword);

                return matchType && matchChecked && matchPeriod && matchKeyword;
            });

            if (!filtered.length) {
                list.innerHTML = "<li class='empty'>이벤트가 없습니다.</li>";
                return;
            }

            filtered.forEach(e => {
                const li = document.createElement("li");

                li.classList.add(e.checkedAt ? 'checked' : 'unchecked');
                if (!e.checkedAt) li.classList.add('not-checked-border');
                li.classList.add(e.type.toLowerCase());

                if (e.id === selectedEventId) li.classList.add('selected');

                li.onclick = () => {
                    selectedEventId = e.id;
                    showDetail(e);
                    renderEvents();
                };

                li.innerHTML = `
                    <strong>#${e.id} ${e.location} - ${e.cam}</strong>
                    <div class="event-type ${e.type.toLowerCase()}">${e.type}</div>
                    <div class="event-time" title="${e.createdAt}">
                        ${e.createdAt} &nbsp;&nbsp; ${relativeTime(e.createdAt)}
                    </div>
                `;
                list.appendChild(li);
            });
        }

        /* ================= 상세 ================= */
        function showDetail(e) {
            document.getElementById("detailBox").innerHTML = `
                <div class="detail-card">
                    <h3 class="event-title ${e.type.toLowerCase()}">${e.type}</h3>

                    <p><strong>카메라</strong> ${e.location} - ${e.cam}</p>
                    <p><strong>발생 시각</strong> ${e.createdAt}</p>

                    <div class="memo-card">
                        <label>메모</label>
                        <textarea id="memoInput" rows="4" style="width:100%">${e.memo ?? ''}</textarea>
                        <button class="primary-btn"
                                style="margin-top:6px"
                                onclick="updateMemo(${e.id})">수정</button>
                    </div>

                    <div class="check-area">
                        ${
                            e.checkedAt
                            ? `<p class="checked-text">✔ 확인 완료 (${e.checkedAt})</p>`
                            : `<button class="primary-btn"
                                       onclick="confirmCheck(${e.id})">
                                   확인 완료 처리
                               </button>`
                        }
                    </div>

                    <!-- 추후 보고서 버튼 자리 -->
                    <div class="report-area"></div>
                </div>
            `;
        }

        /* ================= memo ================= */
        function updateMemo(id){
            const memo = document.getElementById("memoInput").value;
            if(!confirm("메모를 저장합니다.")) return;
            fetch(`/api/events/${id}/memo`, {
                method:"PATCH",
                headers:{ "Content-Type":"application/json" },
                body: JSON.stringify({ memo })
            })
            .then(() => {
                alert("메모가 저장되었습니다.");
                loadEvents();
            });
        }

        /* ================= check ================= */
        function confirmCheck(id){
    if(!confirm("이 이벤트를 확인 완료 처리하면 되돌릴 수 없습니다.\n계속하시겠습니까?")) return;

    fetch(`/api/events/${id}/check`, { method:"PATCH" })
        .then(() => {
            // 1. 목록 다시 로드
            return fetch("/api/events");
        })
        .then(res => res.json())
        .then(data => {
            // 2. events 갱신
            events = data.map(e => ({
                id: e.eventNo,
                cam: e.camDTO.name,
                location: e.camDTO.location,
                type: e.eventType,
                memo: e.memo,
                createdAt: e.createdAt,
                checkedAt: e.checkedAt
            }));

            // 3. 목록 다시 그림
            renderEvents();

            // 4. 현재 이벤트 다시 찾아 상세 갱신
            const updated = events.find(e => e.id === id);
            if(updated){
                showDetail(updated);
            }
        });
}



        window.onload = loadEvents;
    </script>

</div>
</html>
