<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/base}">
<th:block layout:fragment="title">Dashboard : SmarTect</th:block>
<head>
    <!-- 페이지에 해당하는 css로 수정 -->
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <script src="/js/msgpack.min.js"></script>
</head>
<div layout:fragment="content">
    <!-- 페이지 콘텐츠 시작 -->

    <div class="dashboard-container">

        <!-- 상단 제목 영역 -->
        <header class="dashboard-header">
            <div class="header-left">
                <h1>AI CCTV MONITORING</h1>
                <span class="sub-text">실시간 위험 감지 시스템</span>
            </div>
            <div class="header-right">
                <div class="status-badge pulse">
                    <i class="fa-solid fa-bolt"></i> ACTIVE
                </div>
                <button class="control-button">일시정지</button>
            </div>
        </header>

        <!-- 메인 레이아웃 -->
        <main class="dashboard-main">

            <!-- LEFT : LIVE FEED -->
            <section class="feed-section">

                <div class="section-title">
                    <i class="fa-solid fa-video"></i> LIVE FEED
                    <span class="sub-label">실시간 모니터링</span>
                </div>

                <div class="video-grid">

                    <!-- CCTV-01 -->
                    <div class="video-panel">
                        <div class="panel-header">
                            <span class="cctv-name">
                                <i class="fa-solid fa-camera"></i> CCTV-01 정문
                            </span>
                            <span class="rec-indicator">● REC</span>
                        </div>
                        <div class="video-display" style="position: relative;">
                            <img id="live-image-1" src="" alt="CCTV 1" style="width: 100%; height: 100%; object-fit: contain;">

                            <canvas id="detection-canvas-1" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
                        </div>
                        <div class="panel-footer">
                            <span class="ai-status" id="ai-status-1">AI 분석 중...</span>
                        </div>
                    </div>

                    <!-- CCTV-02 -->
                    <div class="video-panel">
                        <div class="panel-header">
                            <span class="cctv-name">
                                <i class="fa-solid fa-camera"></i> CCTV-02 주차장
                            </span>
                            <span class="rec-indicator">● REC</span>
                        </div>
                        <div class="video-display" style="position: relative;">
                            <img id="live-image-2" src="" alt="CCTV 2" style="width: 100%; height: 100%; object-fit: contain;">

                            <canvas id="detection-canvas-2" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
                        </div>
                        <div class="panel-footer">
                            <span class="ai-status" id="ai-status-2">AI 분석 중...</span>
                        </div>
                    </div>

                    <!-- CCTV-03 -->
                    <div class="video-panel">
                        <div class="panel-header">
                            <span class="cctv-name">
                                <i class="fa-solid fa-camera"></i> CCTV-03 복도
                            </span>
                            <span class="rec-indicator">● REC</span>
                        </div>
                        <div class="video-display">
                            <img id="live-image-3" src="" alt="CCTV 3">
                            <canvas id="detection-canvas-3" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
                        </div>
                        <div class="panel-footer">
                            <span class="ai-status" id="ai-status-3">AI 분석 중...</span>
                        </div>
                    </div>

                    <!-- CCTV-04 -->
                    <div class="video-panel">
                        <div class="panel-header">
                            <span class="cctv-name">
                                <i class="fa-solid fa-camera"></i> CCTV-04 비상구
                            </span>
                            <span class="rec-indicator">● REC</span>
                        </div>
                        <div class="video-display">
                            <img id="live-image-4" src="" alt="CCTV 4">
                            <canvas id="detection-canvas-4" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
                        </div>
                        <div class="panel-footer">
                            <span class="ai-status" id="ai-status-4">AI 분석 중...</span>
                        </div>
                    </div>

                </div>
            </section>

            <!-- RIGHT : ALERTS -->
            <aside class="alert-section">

                <!-- 알림 영역 -->
                <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;">
                <div class="section-title error-text">
                    <i class="fa-regular fa-bell"></i> ALERTS
                        <span class="sub-label">고위험 알람 (0)</span>
                    </div>

                    <div class="alert-list-container"
                         id="alert-list-container"
                         style="height: 220px; overflow-y: auto;">
                        <!-- 알림이 동적으로 추가됩니다 -->
                        </div>
                    </div>

                <!-- 탐지 객체 로그 영역 -->
                <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 200px;">
                    <div class="section-title error-text">
                        <i class="fa-solid fa-list"></i> DETECTION LOG
                        <span class="sub-label">실시간 탐지 객체 로그</span>
                    </div>

                    <div class="alert-list-container"
                         id="detection-log-container"
                         style="height: 500px; overflow-y: auto;">
                        <!-- 탐지 로그가 동적으로 추가됩니다 -->
                    </div>
                </div>

            </aside>

        </main>
    </div>

    <script src="/js/dashboard/utils.js"></script>
    <script src="/js/dashboard/alerts.js"></script>
    <script src="/js/dashboard/logs.js"></script>
    <script src="/js/dashboard/stream.js"></script>
    <!--    페이지 콘텐츠 끝    -->
</div>

</html>
