<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/base}">
<head>
    <!-- 페이지에 해당하는 css로 수정 -->
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<div layout:fragment="content">
    <!-- 페이지 콘텐츠 시작 -->

    <div class="dashboard-container">

        <!-- 상단 제목 영역 -->
        <header class="dashboard-header">
            <div class="header-left">
                <h1>AI CCTV MONITORING</h1>
                <span class="sub-text">실시간 위험 감지 시스템</span>
            </div>
            <div class="header-right">
                <div class="status-badge pulse">
                    <i class="fa-solid fa-bolt"></i> ACTIVE
                </div>
                <button class="control-button">일시정지</button>
            </div>
        </header>

        <!-- 메인 레이아웃 -->
        <main class="dashboard-main">

            <!-- LEFT : LIVE FEED -->
            <section class="feed-section">

                <div class="section-title">
                    <i class="fa-solid fa-video"></i> LIVE FEED
                    <span class="sub-label">실시간 모니터링</span>
                </div>

                <div class="video-grid">

                    <!-- CCTV-01 -->
                    <div class="video-panel">
                        <div class="panel-header">
                            <span class="cctv-name">
                                <i class="fa-solid fa-camera"></i> CCTV-01 정문
                            </span>
                            <span class="rec-indicator">● REC</span>
                        </div>
                        <div class="video-display">
                            <img id="live-image" src="" alt="CCTV 1">
                            <canvas id="detection-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
                        </div>
                        <div class="panel-footer">
                            <span class="ai-status">AI 분석 중...</span>
                        </div>
                    </div>

                    <!-- CCTV-02 -->
                    <div class="video-panel">
                        <div class="panel-header">
                            <span class="cctv-name">
                                <i class="fa-solid fa-camera"></i> CCTV-02 주차장
                            </span>
                            <span class="rec-indicator">● REC</span>
                        </div>
                        <div class="video-display">
                            <img th:src="@{/images/placeholder-grid.png}" alt="CCTV 2">
                        </div>
                        <div class="panel-footer">
                            <span class="ai-status">AI 분석 중...</span>
                        </div>
                    </div>

                    <!-- CCTV-03 -->
                    <div class="video-panel">
                        <div class="panel-header">
                            <span class="cctv-name">
                                <i class="fa-solid fa-camera"></i> CCTV-03 복도
                            </span>
                            <span class="rec-indicator">● REC</span>
                        </div>
                        <div class="video-display">
                            <img th:src="@{/images/placeholder-grid.png}" alt="CCTV 3">
                        </div>
                        <div class="panel-footer">
                            <span class="ai-status">AI 분석 중...</span>
                        </div>
                    </div>

                    <!-- CCTV-04 -->
                    <div class="video-panel">
                        <div class="panel-header">
                            <span class="cctv-name">
                                <i class="fa-solid fa-camera"></i> CCTV-04 비상구
                            </span>
                            <span class="rec-indicator">● REC</span>
                        </div>
                        <div class="video-display">
                            <img th:src="@{/images/placeholder-grid.png}" alt="CCTV 4">
                            <div class="bounding-box"
                                 style="top: 60%; left: 45%; width: 25%; height: 30%;">
                                <span class="box-label">물체 이동</span>
                            </div>
                        </div>
                        <div class="panel-footer">
                            <span class="ai-status text-cyan">물체 이동 감지</span>
                        </div>
                    </div>

                </div>
            </section>

            <!-- RIGHT : ALERTS -->
            <aside class="alert-section">

                <div class="section-title error-text">
                    <i class="fa-regular fa-bell"></i> ALERTS
                    <span class="sub-label">고위험 알람 (5)</span>
                </div>

                <div class="alert-list-container">

                    <div class="alert-card critical">
                        <div class="alert-header">
                            <i class="fa-solid fa-triangle-exclamation"></i> 침입자 감지
                        </div>
                        <div class="alert-info">
                            <span class="badge">CCTV-01</span>
                            <span class="time">오후 4:57:50</span>
                        </div>
                    </div>

                    <div class="alert-card warning">
                        <div class="alert-header">
                            <i class="fa-solid fa-fire"></i> 화재 감지
                        </div>
                        <div class="alert-info">
                            <span class="badge">CCTV-01</span>
                            <span class="time">오후 4:57:47</span>
                        </div>
                    </div>

                    <div class="alert-card warning">
                        <div class="alert-header">
                            <i class="fa-solid fa-person-falling"></i> 낙상 감지
                        </div>
                        <div class="alert-info">
                            <span class="badge">CCTV-03</span>
                            <span class="time">오후 4:57:23</span>
                        </div>
                    </div>

                    <div class="alert-card warning">
                        <div class="alert-header">
                            <i class="fa-solid fa-fire"></i> 화재 감지
                        </div>
                        <div class="alert-info">
                            <span class="badge">CCTV-02</span>
                            <span class="time">오후 4:56:56</span>
                        </div>
                    </div>

                </div>

            </aside>

        </main>
    </div>

    <!-- WebSocket 스크립트 -->
    <script>
        const socket = new WebSocket("ws://localhost:8000/ws/video");
        const imgElement = document.getElementById("live-image");
        const canvas = document.getElementById("detection-canvas");
        const ctx = canvas.getContext("2d");
        let lastJsonData = null;
        socket.binaryType = "blob";

        socket.onopen = function () {
            console.log("Java 서버 접속");
        };

        // 이미지 로드 후 Canvas 크기 조정 및 박스 그리기
        function drawBoundingBoxes(jsonData) {
            if (!jsonData || !jsonData.fire_info) return;
            
            const fireInfo = jsonData.fire_info;
            if (!fireInfo || !Array.isArray(fireInfo) || fireInfo.length < 1) return;
            
            const fireMap = fireInfo[0]; // fire_map은 첫 번째 요소
            if (!Array.isArray(fireMap)) return;
            
            // Canvas 크기를 이미지에 맞춤
            canvas.width = imgElement.offsetWidth;
            canvas.height = imgElement.offsetHeight;
            
            // 이전 그리기 지우기
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 이미지 실제 크기와 표시 크기 비율 계산
            const scaleX = canvas.width / imgElement.naturalWidth;
            const scaleY = canvas.height / imgElement.naturalHeight;
            
            // 각 바운딩 박스 그리기
            fireMap.forEach(box => {
                if (!box.x1 && box.x1 !== 0) return; // 유효한 박스인지 확인
                
                const x1 = box.x1 * scaleX;
                const y1 = box.y1 * scaleY;
                const x2 = box.x2 * scaleX;
                const y2 = box.y2 * scaleY;
                const width = x2 - x1;
                const height = y2 - y1;
                
                // 클래스에 따라 색상 결정
                const isFire = box.class === "fire";
                const color = isFire ? "#FF0000" : "#FF8C00"; // fire: 빨강, smoke: 주황
                
                // 박스 그리기
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.strokeRect(x1, y1, width, height);
                
                // 라벨 배경
                const label = box.class;
                ctx.font = "bold 14px Arial";
                const textMetrics = ctx.measureText(label);
                const labelWidth = textMetrics.width + 10;
                const labelHeight = 20;
                
                ctx.fillStyle = color;
                ctx.fillRect(x1, y1 - labelHeight, labelWidth, labelHeight);
                
                // 라벨 텍스트
                ctx.fillStyle = "#FFFFFF";
                ctx.fillText(label, x1 + 5, y1 - 5);
            });
        }

        socket.onmessage = function (event) {
            if (typeof event.data === 'string') {
                // JSON 메시지 수신 (감지 발생 시에만 전송됨)
                try {
                    lastJsonData = JSON.parse(event.data);
                    console.log("JSON 수신 (감지 발생):", lastJsonData);
                    // 이미지가 로드된 후 박스 그리기
                    if (imgElement.complete && imgElement.naturalWidth > 0) {
                        drawBoundingBoxes(lastJsonData);
                    }
                } catch (e) {
                    console.error("JSON 파싱 오류:", e);
                }
            } else if (event.data instanceof Blob) {
                // 이미지 메시지 수신 (항상 전송됨)
                if (imgElement.src.startsWith("blob:")) {
                    URL.revokeObjectURL(imgElement.src);
                }
                const imageUrl = URL.createObjectURL(event.data);
                imgElement.src = imageUrl;
                
                // 이미지 로드 후 처리
                imgElement.onload = function() {
                    // Canvas 크기 조정
                    canvas.width = imgElement.offsetWidth;
                    canvas.height = imgElement.offsetHeight;
                    
                    if (lastJsonData) {
                        // JSON이 있으면 박스 그리기
                        drawBoundingBoxes(lastJsonData);
                    } else {
                        // JSON이 없으면 박스 지우기 (감지 없음)
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    }
                };
            }
        };

        socket.onclose = function () {
            console.log("서버 연결 끊김");
        };
    </script>
    <!--    페이지 콘텐츠 끝    -->
</div>

</html>
