<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/base}">
<th:block layout:fragment="title">Dashboard : SmarTect</th:block>
<head>
    <!-- 페이지에 해당하는 css로 수정 -->
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/msgpack-lite/0.1.26/msgpack.min.js"></script>

    <link rel="stylesheet" href="./css/settings.css">

</head>
<div layout:fragment="content">
    <!-- 페이지 콘텐츠 시작 -->
    <div class="app-container">
        <!-- 헤더 -->
        <header class="top-bar">
            <div class="brand">
                <h1>⚙️ Smart Detection Settings</h1>
            </div>
            <div class="cam-controls">
                <label>CAMERA:</label>
                <select id="camSelect">
                    <option value="1">CAM-01</option>
                    <option value="2">CAM-02</option>
                    <option value="3">CAM-03</option>
                    <option value="4">CAM-04</option>
                </select>
                <span id="connectionStatus" class="badge">Connecting...</span>
            </div>
        </header>

        <main class="main-content">
            <!-- [좌측] 영상 캔버스 -->
            <section class="video-section">
                <div class="canvas-container">
                    <canvas id="cctvCanvas"></canvas>

                    <!-- [추가] AI 실시간 로그 오버레이 -->
                    <div id="aiLogOverlay" class="ai-log-box">
                        <div class="log-header">🤖 AI Live Analysis</div>
                        <div id="aiLogContent" class="log-content">Waiting for data...</div>
                    </div>

                    <div id="overlayInfo">No Signal</div>
                </div>
                <div class="video-footer">
                    <span id="coordInfo">좌표: -</span>
                </div>
            </section>

            <!-- [우측] 설정 탭 패널 -->
            <section class="config-section">
                <!-- 탭 버튼 -->
                <div class="tab-header">
                    <button class="tab-btn active" data-tab="GENERAL">일반 설정</button>
                    <button class="tab-btn" data-tab="ZONE">구역 설정 (그리기)</button>
                </div>

                <div class="tab-content">
                    <!-- 1. 일반 설정 탭 -->
                    <div id="tab-GENERAL" class="tab-pane active">
                        <div class="group-box">
                            <h3>감지 모드 설정 (Detection Mode)</h3>
                            <select id="detection_mode" class="form-control" style="width: 100%; padding: 5px; margin-bottom: 10px;">
                                <option value="mix">복합 감지 (알고리즘 + AI)</option>
                                <option value="algorithm">알고리즘 전용 (낙상/구역)</option>
                                <option value="ai">AI 전용 (행동 인식)</option>

                            </select>

                            <h3>감지 기능 세부 설정 (Activations)</h3>
                            <!-- 기존 체크박스들 유지 (세부 ON/OFF용) -->
                            <div class="control-row"><label><input type="checkbox" id="fall_check"> 낙상 감지</label></div>
                            <div class="control-row"><label><input type="checkbox" id="zone_check"> 구역 침입 감지</label></div>
                        </div>

                        <div class="group-box">
                            <h3>민감도 설정 (Thresholds)</h3>
                            <div class="slider-row">
                                <label>팔뻗음거리 상한 (Reach) <span id="val_reach_ratio"></span></label>
                                <input type="range" id="reach_ratio" min="0.5" max="2.0" step="0.05">
                            </div>
                            <div class="slider-row">
                                <label>손올리기 상한 <span id="val_hip_ratio"></span></label>
                                <input type="range" id="hip_ratio" min="0.5" max="1.0" step="0.05">
                            </div>
                            <div class="slider-row">
                                <label>낙상 비율 <span id="val_fall_ratio"></span></label>
                                <input type="range" id="fall_ratio" min="0.5" max="2.0" step="0.1">
                            </div>
                            <div class="slider-row">
                                <label>AI 신뢰도 <span id="val_ai_threshold"></span></label>
                                <input type="range" id="ai_threshold" min="0.1" max="0.95" step="0.05">
                            </div>
                            <div class="slider-row">
                                <label>경고 잠금(초) <span id="val_lock_duration"></span></label>
                                <input type="range" id="lock_duration" min="1" max="60" step="1">
                            </div>
                        </div>

                        <!-- 공통 시각화 옵션 -->
                        <div class="group-box">
                            <h3>시각화 (Visualization)</h3>
                            <div class="control-row"><label><input type="checkbox" id="vis_alert"> 위험 상태에서만 보기</label></div>
                            <div class="control-row"><label><input type="checkbox" id="vis_bbox"> 객체 박스</label></div>
                            <div class="control-row"><label><input type="checkbox" id="vis_text"> 상태 텍스트</label></div>

                        </div>
                    </div>

                    <!-- 2. 구역 설정 탭 -->
                    <div id="tab-ZONE" class="tab-pane">
                        <div class="guide-box">
                            <p>ℹ️ 화면에 점 4개를 찍어 사각형 구역을 만드세요.</p>
                            <p>👆 구역을 드래그하여 이동할 수 있습니다.</p>
                        </div>

                        <div class="zone-actions">
                            <button id="btnToggleDraw" class="btn-primary small" style="margin-right: 10px;">+ 구역 추가</button>
                            <button id="btnClearZones" class="btn-danger small">전체 삭제</button>
                        </div>

                        <!-- 구역 리스트가 여기에 동적으로 추가됨 -->
                        <div id="zoneListContainer" class="zone-list"></div>
                    </div>
                </div>

                <!-- 하단 저장 버튼 -->
                <div class="panel-footer">
                    <button id="btnSave" class="btn-primary">설정 저장 (Save)</button>
                </div>
            </section>
        </main>
    </div>

    <!-- 메인 스크립트 (모듈) -->
    <script type="module" src="/js/settings/main.js"></script>

</div>

</html>
