<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Main : SmarTect</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <!--  파비콘  -->
    <link rel="icon" th:href="@{/images/favicon.ico}">
</head>
<body>

<!-- MAIN 영역 -->
<section id="main">
    <div class="main-content">
        <h1 class="logo">SmarTect</h1>
        <p class="main-desc">
            AI 기반 실시간 CCTV 위험 감지 및 이벤트 관리 시스템
        </p>
        <a class="main-btn" th:href="@{/dashboard}">
            대시보드 바로 가기
        </a>
        <span class="scroll-hint">▼ 밑으로 내려 리뷰를 작성해 보세요!</span>
    </div>
</section>

<!-- BOARD 영역 -->
<section id="board">
    <div class="board-container">

        <h2 class="board-title">리뷰 게시판</h2>

        <!-- 글 작성 -->
        <div class="board-write">
            <form th:action="@{/api/post}" method="post" id="postForm">
                <!--    csrf 토큰, 작성자 ip 정보 전달 추가해야함 @@        -->
                <input name="title" type="text" placeholder="제목" required>
                <textarea name="content" placeholder="내용을 입력해 주세요." required></textarea>
                <button type="submit">등록</button>
            </form>
            <div id="postError" class="error" style="display:none;"></div>
        </div>

        <!-- 게시글 -->
        <!--    @@ 게시물 작성 기능 구현 후 수정    -->

        <!--board-list 시작 -->
        <div id="postList">
            <!--    게시물 없을 때    -->
            <div class="board-post" th:if="${#lists.isEmpty(boardList)}"
                 id="emptyMessage">
                아직 작성된 게시물이 없습니다. 리뷰를 남겨보세요!
            </div>
            <!--        게시물 있을 때  -->
            <div class="board-post" th:each="post : ${boardList}">
                <div class="post-header">
                    <span class="post-title" th:text="${post.title}">제목</span>
                    <span class="post-writer" th:text="${post.writerInfo}">글쓴이</span>
                </div>
                <p class="post-content" th:text="${post.content}">
                    내용
                </p>
                <span class="post-time"
                      th:text="${post.createdAt}">
                            작성일
                        </span>
            </div>

        </div>
        <!-- board-list 끝 -->
        <script>
            const form = document.getElementById("postForm");
            const postList = document.getElementById("postList");
            const postError = document.getElementById("postError");

            function showError(msg){
                postError.textContent = msg;
                postError.style.display='block'
            }
            function clearError(){
                postError.textContent= '';
                postError.style.display='none';
            }
            <!--      기호 변환      -->
            function escapeHtml(str) {
                return str
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
             }

            <!--      게시글 양식      -->
            function renderPostCard(post){
                const div = document.createElement('div');
                div.className='board-post';
                div.innerHTML = `
                  <div class="post-header">
                    <span class="post-title">${escapeHtml(post.title)}</span>
                    <span class="post-writer">${escapeHtml(post.writerInfo)}</span>
                  </div>
                  <p class="post-content">${escapeHtml(post.content)}</p>
                  <span class="post-time">${escapeHtml(post.createdAt)}</span>
                `;
                return div;
            }

            form.addEventListener('submit', async(e)=>{
                e.preventDefault();
                clearError();

                const formData = new FormData(form);
                const title = (formData.get('title') || '').toString().trim();
                const content = (formData.get('content') || '').toString().trim();
                    if (!title || !content) {
                        showError('제목과 내용을 입력해 주세요.');
                    return;
                    }

                // json으로 전송
                const payload = {title,content};

                try{
                    const res = await fetch(form.action,{
                    method: 'POST',
                    headers:{
                        'Content-Type' : 'application/json'
                        // CSRF 사용시 수정 필요 @@
                    },
                    body:JSON.stringify(payload)
                    }); //fetch

                    if(!res.ok){
                        // 400/500 에러 발생시
                        const text = await res.text();
                        showError(text || '등록에 실패했습니다.');
                        return;
                    }
                    <!--  비동기방식으로 게시글 작성 후에 "게시물이 없습니다" 안내문 삭제 (1)  -->
                    const emptyMessage = document.getElementById("emptyMessage");

                    const saved = await res.json();
                    const card = renderPostCard(saved);

                    <!--  비동기방식으로 게시글 작성 후에 "게시물이 없습니다" 안내문 삭제 (2)  -->
                    if(emptyMessage){
                        emptyMessage.remove();
                    }

                    <!--   새로 작성된 게시글 맨 위쪽으로 추가  -->
                    postList.prepend(card);
                    // 입력창 초기화
                    form.reset();
                }catch(err){
                    showError('작성 실패. 오류가 발생했습니다.');
                    console.error(err);
                }

            });

        </script>
    </div>
</section>

</body>
</html>
