spring.application.name=controller
# 톰캣 포트 설정
server.port = 8080
# logging level 설정 debug,warn,error ...
logging.level.root = info
# Security logging level 설정
logging.level.org.springframework.security=DEBUG

# Maria DB 설정
spring.datasource.url=jdbc:mariadb://192.168.0.14:3306/smartect?serverTimezone=Asia/Seoul
spring.datasource.username=smartect
spring.datasource.password=smartect1!
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# 타임존 설정
spring.jpa.properties.hibernate.jdbc.time_zone = Asia/Seoul
# 프론트 / 로그 표시
spring.jackson.time-zone=Asia/Seoul


# JPA
# 데이터베이스 스키마 관리 설정
# update -> none
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

