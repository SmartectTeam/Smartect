spring.application.name=controller
# 톰캣 포트 설정
server.port = 8080
# logging level 설정 debug,warn,error ... info -> warn
logging.level.root = warn
# Security logging level 설정 DEBUG -> error
logging.level.org.springframework.security=error
# Hibernate SQL 로그 끄기
logging.level.org.hibernate.SQL=off
logging.level.org.hibernate.type.descriptor.sql=off
# WebSocket 내부 로그 끄기
logging.level.org.springframework.web.socket=warn
# 우리 프로젝트 로그만 info
logging.level.org.smartect=info

# Maria DB 설정
spring.datasource.url=jdbc:mariadb://192.168.0.14:3306/smartect?serverTimezone=Asia/Seoul
spring.datasource.username=smartect
spring.datasource.password=smartect1!
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# 타임존 설정
spring.jpa.properties.hibernate.jdbc.time_zone = Asia/Seoul
# 프론트 / 로그 표시
spring.jackson.time-zone=Asia/Seoul


# JPA
# 데이터베이스 스키마 관리 설정
# update -> none
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# pc ip
python.hsyServer.ip=192.168.0.166
python.cjhServer.ip=192.168.0.175
python.ahsServer.ip=192.168.0.172
python.hsmServer.ip=192.168.0.177
python.yjeServer.ip=192.168.0.179

# 로그 카테고리별 판단 기준
smartect.event-policy.warning-seconds=8
smartect.event-policy.danger-seconds=3
smartect.event-policy.end-gap-seconds=5
smartect.event-policy.cleanup-ttl-seconds=120